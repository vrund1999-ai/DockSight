[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "docksight"
version = "0.1.0"
description = "Analytics and ML insights for a last-mile industrial real estate portfolio"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "python-dateutil>=2.9",
    "scikit-learn>=1.5",
    "joblib>=1.4",
]

[project.optional-dependencies]
ml = ["mlflow>=2.16"]
streamlit = ["streamlit>=1.38", "plotly>=5.24"]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["docksight*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
