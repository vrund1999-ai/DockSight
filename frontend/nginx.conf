server {
    listen 8080;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'" always;

    # Hashed assets are immutable; cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API_UPSTREAM is filled in at container start: http://api:8000 under Compose, the API's
    # internal app name on Azure Container Apps. The Host header is left as the upstream's own
    # name, because Container Apps routes internal traffic by host.
    location /api/ {
        proxy_pass ${API_UPSTREAM};
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Client-side routing: unknown paths fall back to the SPA shell.
    location / {
        try_files $uri /index.html;
    }
}
